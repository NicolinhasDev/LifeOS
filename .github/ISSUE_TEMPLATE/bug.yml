name: "🐛 Bug"
description: "Reportar um problema"
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Reporte de Bug

  - type: textarea
    id: description
    attributes:
      label: 📝 Descrição
      description: Descreva claramente o problema.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔄 Passos para reproduzir
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Resultado esperado
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: ❌ Resultado atual
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 Severidade
      options:
        - Crítica
        - Alta
        - Média
        - Baixa
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 💻 Ambiente
      placeholder: "Windows 11 • Chrome 138"

  - type: textarea
    id: logs
    attributes:
      label: 📋 Logs / Prints