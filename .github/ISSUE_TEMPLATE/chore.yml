name: "🧹 Chore"
description: "Tarefa técnica, infraestrutura ou manutenção"
title: "[Chore] "
labels:
  - chore

body:
  - type: markdown
    attributes:
      value: |
        ## 🧹 Chore

        Utilize este formulário para tarefas que não adicionam funcionalidades ao usuário final.

  - type: textarea
    id: objective
    attributes:
      label: 🎯 Objetivo
      description: O que precisa ser feito?
      placeholder: "Exemplo: Configurar Docker Compose."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 📝 Motivo
      description: Por que essa tarefa é necessária?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 📦 Área Impactada
      options:
        - label: Frontend
        - label: Backend
        - label: Banco de Dados
        - label: Infraestrutura
        - label: DevOps
        - label: Documentação

  - type: dropdown
    id: priority
    attributes:
      label: 🚨 Prioridade
      options:
        - Alta
        - Média
        - Baixa
    validations:
      required: true

  - type: dropdown
    id: estimate
    attributes:
      label: 📏 Estimativa
      options:
        - XS
        - S
        - M
        - L
        - XL

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ Critérios de Aceite
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 💬 Observações