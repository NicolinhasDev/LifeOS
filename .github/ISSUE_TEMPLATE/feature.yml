name: "✨ Feature"
description: "Solicitar uma nova funcionalidade para o LifeOS"
title: "[Feature] "
labels:
  - feature

body:
  - type: markdown
    attributes:
      value: |
        Obrigado por contribuir com o **LifeOS**.

        Preencha todas as informações abaixo antes de criar a Issue.

  - type: textarea
    id: objective
    attributes:
      label: 🎯 Objetivo
      description: "O que deve ser desenvolvido?"
      placeholder: "Exemplo: Criar o componente Button do Design System."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 📝 Contexto
      description: "Por que essa funcionalidade é necessária?"
      placeholder: "Explique o problema que será resolvido."
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 📦 Escopo
      description: "Marque tudo o que faz parte desta entrega."
      options:
        - label: Frontend
        - label: Backend
        - label: Banco de Dados
        - label: API
        - label: UI
        - label: UX
        - label: Testes
        - label: Documentação

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ Critérios de Aceite
      description: "Como saberemos que a tarefa foi concluída?"
      placeholder: |
        - Funcionalidade implementada
        - Código tipado
        - Responsivo
        - Testes passando
        - Documentação atualizada
    validations:
      required: true

  - type: dropdown
    id: estimate
    attributes:
      label: 📏 Estimativa
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 🚨 Prioridade
      options:
        - Alta
        - Média
        - Baixa
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 🧩 Módulo
      options:
        - Core
        - Auth
        - Dashboard
        - Finance
        - Goals
        - Health
        - Study
        - Career
        - Productivity
        - Analytics
        - Infrastructure
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: 🎯 Milestone
      description: "Sprint ou versão prevista."
      placeholder: "Sprint 0 - Fundação"

  - type: input
    id: dependencies
    attributes:
      label: 🔗 Dependências
      description: "Informe outras Issues relacionadas."
      placeholder: "#12"

  - type: textarea
    id: mockups
    attributes:
      label: 🎨 Mockups / Referências
      description: "Links do Figma, imagens ou referências visuais."

  - type: textarea
    id: notes
    attributes:
      label: 💬 Observações
      description: "Informações adicionais."

  - type: checkboxes
    id: checklist
    attributes:
      label: ✔️ Checklist
      options:
        - label: Li a documentação do projeto.
          required: true
        - label: Verifiquei que essa funcionalidade ainda não existe.
          required: true
        - label: Esta Issue possui informações suficientes para desenvolvimento.
          required: true